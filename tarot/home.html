    <style>
    .image-container {
  display: flex;
  /* Optional: adds space between images */
  justify-content: space-around; 
}

.image-container img {
  /* Optional: ensures images fit within their container */
  max-width: 100%; 
  height: auto; /* Maintains aspect ratio */
  margin: 10px;
  padding: 20px;
}
  img { image-rendering: pixelated; }
.card {
    width: 150px;
    height: 254.19px;
    perspective: 1000px;
}

.card-img {
    width: 100%;
    height: 100%;
    position: absolute;
    backface-visibility: hidden;
    transition: transform 0.5s;
}

.card-img-back {
    transform: rotateY(180deg);
}

.flipped .card-img-front {
    transform: rotateY(180deg);
}

.flipped .card-img-back {
    transform: rotateY(0deg);
}
</style>
