    <style>
      img { image-rendering: pixelated; }
       .image-container {
  display: flex;
  /* Optional: adds space between images */
  justify-content: space-around; 
}

.image-container img {
  /* Optional: ensures images fit within their container */
  max-width: 100%; 
  height: auto; /* Maintains aspect ratio */
  margin: 10px;
  padding: 20px;
}
      body { 
      color: #fff; 
      }
      #wipe span {
      display: inline-block;
      transition: transform 0.3s ease-out,
      opacity 0.3s ease-out,
      filter 0.3s ease-out,
      color 0.3s ease-out,
      text-shadow 0.3s ease-out;
      }
      .card {
      width: 150px;
      height: 254.19px;
      perspective: 1000px;
      margin: 30px auto;
      position: relative;
      }
      .card-img {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      transition: transform 0.5s;
      }
      .card-img-back {
      transform: rotateY(180deg);
      }
      .flipped .card-img-front {
      transform: rotateY(180deg);
      }
      .flipped .card-img-back {
      transform: rotateY(0deg);
      }
      .rotate-90 {
      width: 150px;
      height: 254.19px;
      transform: rotate(0.5turn);
      }
    </style>
  </head>

    <script>
const spellChars = ["✦","✧","✺","✴","✹"];
const fgcolour = "#6600cc";  // glow color
const glcolour = "#cc99ff";  // glow shadow
const speed = 05;

// Select all elements with class 'wipe'
const wipeElements = document.querySelectorAll(".wipe");

wipeElements.forEach(wipeEl => {
  const text = wipeEl.textContent;
  wipeEl.textContent = "";

  const letters = [];

  // Create span for each letter
  for (let i = 0; i < text.length; i++) {
    const span = document.createElement("span");
    span.textContent = text[i];
    span.style.color = "#fff";
    span.style.opacity = 1;
    span.style.transition = "transform 0.3s ease-out, opacity 0.3s ease-out";
    wipeEl.appendChild(span);
    letters.push({el: span});
  }

  // Animate all letters together
  function animateAll() {
    let opacity = 1;
    let translateY = 0;
    let angle = 0;

    function step() {
      if (opacity <= 0) {
        wipeEl.style.display = "none"; // hide completely when done
        return;
      }

      // 20% chance to replace all letters with magical glyphs
      letters.forEach(letter => {
        if (Math.random() < 0.2) {
          letter.el.textContent = spellChars[Math.floor(Math.random() * spellChars.length)];
          letter.el.style.color = fgcolour;
          letter.el.style.textShadow = glcolour + " 0px 0px 5px";
        } else {
          letter.el.style.color = "#fff";
          letter.el.style.textShadow = "none";
          letter.el.textContent = text[letters.indexOf(letter)];
        }
      });

      // Apply transform & fade to entire element
      translateY -= 2;
      angle += 5;
      opacity -= 0.02;

      wipeEl.style.transform = `translateY(${translateY}px) rotate(${angle}deg) scale(0.8)`;
      wipeEl.style.opacity = opacity;
      wipeEl.style.filter = "blur(5px)";

      requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  }

  // Start animation after short delay
  setTimeout(animateAll, 13);
});
</script>
